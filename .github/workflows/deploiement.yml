# deploiement.yml - à chaque push sur main, vérifie le code, construit le site
# et le publie sur GitHub Pages. Le dossier dist/ n'entre jamais dans le dépôt.

name: Déploiement sur GitHub Pages

on:
  push:
    branches: [main]
  # Permet aussi de relancer un déploiement à la main depuis l'onglet Actions.
  workflow_dispatch:

# Droits minimaux nécessaires pour publier sur GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois : un nouveau push attend la fin du précédent.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Vérifier et construire le site
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm ci installe exactement les versions de package-lock.json.
      - name: Installer les dépendances
        run: npm ci

      # Un code qui ne passe pas le lint ou les tests n'est pas publié.
      - name: Vérifier le code
        run: npm run lint

      - name: Lancer les tests
        run: npm test

      # Les deux variables sont publiques par nature (clé anon protégée par le
      # RLS) : elles sont lues dans les variables du dépôt, pas dans les secrets.
      - name: Construire le site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_CLE_ANON: ${{ vars.VITE_SUPABASE_CLE_ANON }}

      # GitHub Pages renvoie 404.html pour toute adresse sans fichier
      # correspondant (/tickets, /inventaire...). En y copiant index.html,
      # l'application se charge quand même et React Router affiche la bonne page.
      - name: Rediriger les adresses inconnues vers l'application
        run: cp dist/index.html dist/404.html

      - name: Préparer la publication
        uses: actions/configure-pages@v6

      - name: Envoyer le site construit
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publier:
    name: Publier sur GitHub Pages
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Mettre le site en ligne
        id: deploiement
        uses: actions/deploy-pages@v5
